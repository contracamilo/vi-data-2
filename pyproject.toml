[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netflix-dashboard"
version = "0.1.0"
description = "Dashboard interactivo del catálogo de Netflix con Dash"
requires-python = ">=3.10"
dependencies = ["dash>=2.17", "plotly>=5.22", "pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
